<section class="captch">
    <form [formGroup]="form">
        <div id="captcha"> </div>
        <input type="text" placeholder="Enter CAPTCHA" formControlName="userAnswer">
        <button (click)="checkAnswer()">
            Submit
        </button>
    </form>
    @if (isCorrect !== null) {
    <p class="feedback" [class.correct]="isCorrect === true" [class.incorrect]="isCorrect === false">
        {{ isCorrect ? '✓ Correct!' : '✕ Incorrect. Please try again.' }}
    </p>
    <button type="button" (click)="previouslevel()">
        ← previous Level
    </button>
    }
</section>
